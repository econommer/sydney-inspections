<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Rental Inspection Route</title>
<style>
  :root { --bg: #f6f5f2; --panel: #fff; --ink: #1d1d1b; --muted: #6b6a66; --line: #e3e1db; --accent: #c2410c; --err: #b91c1c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #151514; --panel: #1f1f1d; --ink: #f1f0ec; --muted: #a3a29c; --line: #34332f; --accent: #fb923c; --err: #f87171; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; }
  form { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 24px; width: 100%; max-width: 340px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
  input[type=password] { width: 100%; font: inherit; font-size: 16px; padding: 10px 12px; border: 1px solid var(--line);
         border-radius: 8px; background: var(--bg); color: var(--ink); }
  label { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); margin: 12px 0 16px; }
  button { width: 100%; font: inherit; font-weight: 600; padding: 10px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
  .err { color: var(--err); font-size: 13px; min-height: 18px; margin-top: 10px; }
</style>
</head>
<body>
<form id="f">
  <h1>Rental inspections</h1>
  <p>Enter the password to open the schedule.</p>
  <input type="password" id="pw" inputmode="numeric" autocomplete="current-password" placeholder="Password" autofocus>
  <label><input type="checkbox" id="remember" checked> Remember on this device</label>
  <button type="submit" id="go">Open</button>
  <div class="err" id="err"></div>
</form>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function unlock(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(SALT), iterations: ITER, hash: "SHA-256" },
                                            base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(IV) }, key, b64(DATA));
  return new TextDecoder().decode(plain);
}

function show(html) { document.open(); document.write(html); document.close(); }

async function tryOpen(pw, remember) {
  const err = document.getElementById("err"), go = document.getElementById("go");
  go.disabled = true; go.textContent = "Opening…"; err.textContent = "";
  try {
    const html = await unlock(pw);
    try { remember ? localStorage.setItem("insp-pw", pw) : localStorage.removeItem("insp-pw"); } catch (e) {}
    show(html);
  } catch (e) {
    try { localStorage.removeItem("insp-pw"); } catch (e2) {}
    err.textContent = "Wrong password, try again.";
    go.disabled = false; go.textContent = "Open";
  }
}

document.getElementById("f").addEventListener("submit", e => {
  e.preventDefault();
  tryOpen(document.getElementById("pw").value, document.getElementById("remember").checked);
});

let saved = null;
try { saved = localStorage.getItem("insp-pw"); } catch (e) {}
if (saved) tryOpen(saved, true);
